version: 2

sources:
  - name: staging
    database: finance
    schema: staging
    tables:
      - name: raw_prices
      - name: raw_fundamentals

models:
  - name: stg_prices
    description: Cleaned daily prices, one row per ticker per day.
    columns:
      - name: ticker
        tests: [not_null]
      - name: date
        tests: [not_null]
      - name: close
        tests:
          - not_null
          - accepted_range:
              min_value: 0
              max_value: 1000000
              inclusive: false
      - name: volume
        tests:
          - accepted_range:
              min_value: 0
              inclusive: true
    tests:
      - unique:
          column_name: "ticker || '-' || date"

  - name: stg_fundamentals
    description: Company fundamentals from FMP (optional source).
    columns:
      - name: ticker
        tests: [unique, not_null]

services:
  postgres:
    image: postgres:16
    container_name: finance-postgres
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs once on first start to create schemas/tables.
      - ./sql/01_create_schemas.sql:/docker-entrypoint-initdb.d/01_create_schemas.sql
      - ./sql/02_create_staging.sql:/docker-entrypoint-initdb.d/02_create_staging.sql
      - ./sql/03_create_marts.sql:/docker-entrypoint-initdb.d/03_create_marts.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
